name: Update VRT baselines

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to update
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Regenerate the 17 PR snapshots
        run: npx playwright test -c playwright.vrt.config.ts --grep @pr --update-snapshots
      - name: Recompress
        run: |
          if ! command -v oxipng >/dev/null; then
            apt-get update && apt-get install -y oxipng || true
          fi
          if command -v oxipng >/dev/null; then
            oxipng -o 4 --strip safe tests/vrt/__screenshots__
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/vrt/__screenshots__
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git commit -m "test(vrt): update PR baselines"
          git push
