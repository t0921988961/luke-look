name: CI

on:
  pull_request:
  push:
    branches: [main, cursor/develop-0acd]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: No plain email in the build output
        run: npm run check:email
      - name: Size budgets
        run: npm run budgets

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # Keep in sync with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          ANALYTICS_FORCE: "1"
      - name: E2E and accessibility
        run: npx playwright test
      - name: Visual regression (17 snapshots)
        run: npx playwright test -c playwright.vrt.config.ts --grep @pr
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # robots.txt allows crawling only when this is production. Lighthouse
          # scores the built file, so the job has to build the production rules.
          VERCEL_ENV: production
      - name: Lighthouse
        run: npm run lhci
