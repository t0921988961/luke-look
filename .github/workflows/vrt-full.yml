name: VRT full matrix

on:
  workflow_dispatch:
    inputs:
      update:
        description: Write new baselines instead of only comparing
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  full:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: All 38 snapshots
        run: npx playwright test -c playwright.vrt.config.ts ${{ inputs.update && '--update-snapshots' || '' }}
      - name: Commit refreshed baselines
        if: ${{ inputs.update }}
        run: |
          if command -v oxipng >/dev/null || apt-get update && apt-get install -y oxipng; then
            oxipng -o 4 --strip safe tests/vrt/__screenshots__ || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/vrt/__screenshots__
          git diff --cached --quiet && exit 0
          git commit -m "test(vrt): update the full matrix"
          git push
